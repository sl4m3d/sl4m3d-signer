name: Build macOS packages
on:
  workflow_dispatch:
  push:
    tags: ["v1.2.0"]
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-latest
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build DMG and PKG
        run: bash mac/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sl4m3d-signer-macos-${{ matrix.arch }}-v1.2
          path: mac/output/${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 30
