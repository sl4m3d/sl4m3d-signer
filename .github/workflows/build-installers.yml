
name: Build and release sl4m3d Signer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release version"
        required: true
        default: "v1.2.0"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: signer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: choco install openssl.light innosetup --yes --no-progress

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        shell: powershell
        run: .\windows\build-windows.ps1

      - name: Verify
        shell: powershell
        run: |
          $file = "windows/output/sl4m3d-Signer-Setup-v1.2.0.exe"
          if (!(Test-Path $file)) { throw "Installer missing" }
          if ((Get-Item $file).Length -lt 1MB) { throw "Installer too small" }

      - uses: actions/upload-artifact@v4
        with:
          name: signer-windows
          path: windows/output/sl4m3d-Signer-Setup-v1.2.0.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p out/android
          cp android/app/build/outputs/apk/debug/app-debug.apk out/android/installer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: signer-android
          path: out/android/installer.apk
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            label: intel
          - runner: macos-latest
            arch: arm64
            label: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        run: bash mac/build-macos.sh

      - name: Verify
        run: |
          set -euo pipefail
          test -s "mac/output/${{ matrix.arch }}/sl4m3d-Signer-v1.2.0-${{ matrix.arch }}.dmg"
          test -s "mac/output/${{ matrix.arch }}/sl4m3d-Signer-v1.2.0-${{ matrix.arch }}.pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: signer-macos-${{ matrix.label }}
          path: |
            mac/output/${{ matrix.arch }}/*.dmg
            mac/output/${{ matrix.arch }}/*.pkg
          if-no-files-found: error

  linux:
    name: Linux packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate Debian package
        run: |
          set -euo pipefail
          test -s linux/installer.deb
          dpkg-deb --info linux/installer.deb
          dpkg-deb --contents linux/installer.deb >/dev/null

      - name: Validate portable archive
        run: |
          set -euo pipefail
          test -s linux/portable/sl4m3d-signer-linux-portable.tar.gz
          tar -tzf linux/portable/sl4m3d-signer-linux-portable.tar.gz >/dev/null

      - name: Verify checksums
        working-directory: linux
        run: sha256sum --check SHA256SUMS.txt

      - name: Stage packages
        run: |
          mkdir -p out/linux
          cp linux/installer.deb out/linux/installer.deb
          cp linux/portable/sl4m3d-signer-linux-portable.tar.gz out/linux/installer-portable.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: signer-linux
          path: out/linux/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [windows, android, macos, linux]
    if: ${{ success() }}

    steps:
      - uses: actions/checkout@v4

      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          pattern: signer-*
          path: collected

      - name: Assemble downloads
        run: |
          set -euo pipefail

          mkdir -p release/windows release/android release/linux release/mac

          cp collected/signer-windows/*.exe release/windows/installer.exe
          cp collected/signer-android/installer.apk release/android/installer.apk

          cp collected/signer-linux/installer.deb release/linux/installer.deb
          cp collected/signer-linux/installer-portable.tar.gz release/linux/installer-portable.tar.gz

          cp collected/signer-macos-intel/*.dmg release/mac/installer-intel.dmg
          cp collected/signer-macos-intel/*.pkg release/mac/installer-intel.pkg

          cp collected/signer-macos-arm64/*.dmg release/mac/installer-arm64.dmg
          cp collected/signer-macos-arm64/*.pkg release/mac/installer-arm64.pkg

          cat > release/README.txt <<'EOF'
          sl4m3d Signer 1.2.0

          WINDOWS
          windows/installer.exe

          ANDROID
          android/installer.apk

          LINUX
          linux/installer.deb
          linux/installer-portable.tar.gz

          MACOS INTEL
          mac/installer-intel.dmg
          mac/installer-intel.pkg

          MACOS APPLE SILICON
          mac/installer-arm64.dmg
          mac/installer-arm64.pkg

          Signing status:
          Windows: unsigned
          Android: debug-signed
          macOS: ad-hoc signed, not notarized
          EOF

          (
            cd release
            find windows android linux mac -type f -print0 |
              sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )

          zip -r sl4m3d-signer-installers.zip release

      - name: Select release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            release/windows/installer.exe \
            release/android/installer.apk \
            release/linux/installer.deb \
            release/linux/installer-portable.tar.gz \
            release/mac/installer-intel.dmg \
            release/mac/installer-intel.pkg \
            release/mac/installer-arm64.dmg \
            release/mac/installer-arm64.pkg \
            release/SHA256SUMS.txt \
            sl4m3d-signer-installers.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "sl4m3d Signer ${{ steps.tag.outputs.tag }}" \
            --notes-file release/README.txt
