name: Extract installer buildkit

on:
  workflow_dispatch:
  push:
    paths:
      - "sl4m3d-signer-installer-buildkit.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          archive = Path("sl4m3d-signer-installer-buildkit.zip")
          target = Path(".")

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  path = Path(item.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise ValueError(f"Unsafe ZIP path: {item.filename}")
              z.extractall(target)

          print("ZIP extracted successfully")
          PY

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract installer buildkit"
          git push
