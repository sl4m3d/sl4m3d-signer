
name: Build Online Installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release version"
        required: true
        default: "v1.2.1"
        type: string

permissions:
  contents: write

concurrency:
  group: signer-online-build
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4

      - name: Extract patch
        shell: pwsh
        run: |
          Expand-Archive `
            -LiteralPath "sl4m3d-online-installer-patch.zip" `
            -DestinationPath "$env:RUNNER_TEMP/patch" -Force

          Copy-Item "$env:RUNNER_TEMP/patch/windows" "." -Recurse -Force

      - name: Install tools
        run: choco install openssl.light innosetup --yes --no-progress

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        shell: powershell
        run: .\windows\build-windows.ps1

      - name: Check installer
        shell: pwsh
        run: |
          $file = "windows/output/installer.exe"
          if (!(Test-Path $file)) {
            throw "installer.exe missing"
          }

          if ((Get-Item $file).Length -ge 10MB) {
            throw "Windows installer exceeds 10 MB"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: windows/output/*
          if-no-files-found: error

  android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/installer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-installer
          path: out/installer.apk

  macos:
    name: Build macOS payload
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-latest
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Extract patch
        run: |
          mkdir -p "$RUNNER_TEMP/patch"
          unzip -o sl4m3d-online-installer-patch.zip 'mac/*' -d "$RUNNER_TEMP/patch"
          cp -R "$RUNNER_TEMP/patch/mac/." mac/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        run: bash mac/build-macos.sh

      - name: Prepare payload
        run: |
          set -euo pipefail
          mkdir -p out
          ditto -c -k --sequesterRsrc \
            "dist/sl4m3d Signer.app" \
            "out/mac-payload-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: out/mac-payload-${{ matrix.arch }}.zip

  linux:
    name: Validate Linux
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Validate packages
        run: |
          set -euo pipefail
          test -s linux/installer.deb
          dpkg-deb --info linux/installer.deb
          test -s linux/portable/sl4m3d-signer-linux-portable.tar.gz
          tar -tzf linux/portable/sl4m3d-signer-linux-portable.tar.gz >/dev/null
          (cd linux && sha256sum --check SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            linux/installer.deb
            linux/portable/sl4m3d-signer-linux-portable.tar.gz

  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04

    needs:
      - windows
      - android
      - macos
      - linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: collected

      - name: Extract macOS package script
        run: |
          mkdir -p "$RUNNER_TEMP/patch"
          unzip -o sl4m3d-online-installer-patch.zip 'mac/pkg-scripts/*' -d "$RUNNER_TEMP/patch"
          mkdir -p mac/pkg-scripts
          cp -R "$RUNNER_TEMP/patch/mac/pkg-scripts/." mac/pkg-scripts/
          chmod +x mac/pkg-scripts/postinstall

      - name: Assemble release
        run: |
          set -euo pipefail

          mkdir -p release

          cp collected/windows-installer/installer.exe release/installer.exe
          cp collected/android-installer/installer.apk release/installer.apk

          cp collected/linux-installers/installer.deb release/installer.deb
          cp collected/linux-installers/sl4m3d-signer-linux-portable.tar.gz release/installer-portable.tar.gz

          cp collected/macos-x86_64/mac-payload-x86_64.zip release/
          cp collected/macos-arm64/mac-payload-arm64.zip release/

          pkgbuild \
            --nopayload \
            --scripts mac/pkg-scripts \
            --identifier "is.great.sl4m3d.signer.bootstrap" \
            --version "1.2.0" \
            --install-location / \
            release/installer.pkg

          mkdir -p dmg-stage
          cp release/installer.pkg dmg-stage/
          hdiutil create \
            -volname "sl4m3d Signer Installer" \
            -srcfolder dmg-stage \
            -ov \
            -format UDZO \
            release/installer.dmg

          for file in release/installer.pkg release/installer.dmg; do
            size=$(stat -f%z "$file")
            echo "$file: $((size / 1024 / 1024)) MB"
            test "$size" -lt 10485760
          done

          cat > release/README.txt <<'EOF'
          sl4m3d Signer

          Windows: installer.exe
          macOS: installer.pkg / installer.dmg
          Android: installer.apk
          Linux: installer.deb / installer-portable.tar.gz

          macOS supports Intel and Apple Silicon.
          Internet access is required for online installation.

          Windows is unsigned.
          macOS is ad-hoc signed and not notarized.
          Android APK is debug-signed.
          EOF

          (
            cd release
            shasum -a 256 \
              installer.exe installer.apk installer.deb \
              installer-portable.tar.gz installer.pkg installer.dmg \
              mac-payload-x86_64.zip mac-payload-arm64.zip \
              > SHA256SUMS.txt
          )

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" --clobber

            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "sl4m3d Signer $RELEASE_TAG" \
              --notes-file release/README.txt
          else
            gh release create "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "sl4m3d Signer $RELEASE_TAG" \
              --notes-file release/README.txt
          fi
