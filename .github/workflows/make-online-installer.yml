
name: Build Online Installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release version"
        required: true
        default: "v1.2.0"
        type: string

permissions:
  contents: write

concurrency:
  group: signer-online-build
  cancel-in-progress: false

jobs:
  windows:
    name: Windows Online Installer
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4

      - name: Extract Windows build files
        shell: pwsh
        run: |
          $patch = "$env:RUNNER_TEMP/patch"
          Expand-Archive "sl4m3d-online-installer-patch.zip" $patch -Force

          Copy-Item "$patch/windows/*" "windows/" -Recurse -Force

      - name: Install build tools
        run: choco install openssl.light innosetup --yes --no-progress

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build Windows bootstrap installer
        shell: powershell
        run: .\windows\build-windows.ps1

      - name: Verify Windows files
        shell: pwsh
        run: |
          $installer = "windows/output/installer.exe"
          $payload = "windows/output/windows-payload.zip"

          if (!(Test-Path $installer)) {
            throw "installer.exe was not generated"
          }

          if (!(Test-Path $payload)) {
            throw "windows-payload.zip was not generated"
          }

          if ((Get-Item $installer).Length -ge 10MB) {
            throw "Windows installer exceeds 10 MB"
          }

          if ((Get-Item $payload).Length -lt 1MB) {
            throw "Windows payload is unexpectedly small"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            windows/output/installer.exe
            windows/output/windows-payload.zip
          if-no-files-found: error

  macos:
    name: macOS Payload (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64

          - runner: macos-latest
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Extract macOS build files
        run: |
          mkdir -p "$RUNNER_TEMP/patch"
          unzip -o sl4m3d-online-installer-patch.zip \
            'mac/build-macos.sh' \
            -d "$RUNNER_TEMP/patch"

          cp "$RUNNER_TEMP/patch/mac/build-macos.sh" mac/build-macos.sh
          chmod +x mac/build-macos.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build architecture-specific payload
        run: bash mac/build-macos.sh

      - name: Verify payload
        run: |
          set -euo pipefail
          test -s "mac/output/${{ matrix.arch }}/mac-payload-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: mac/output/${{ matrix.arch }}/mac-payload-${{ matrix.arch }}.zip
          if-no-files-found: error

  macos-bootstrap:
    name: Create Universal macOS Installers
    runs-on: macos-latest
    needs: macos

    steps:
      - uses: actions/checkout@v4

      - name: Download macOS payloads
        uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: payloads
          merge-multiple: true

      - name: Extract installer script
        run: |
          mkdir -p "$RUNNER_TEMP/patch"
          unzip -o sl4m3d-online-installer-patch.zip \
            'mac/pkg-scripts/postinstall' \
            -d "$RUNNER_TEMP/patch"

          mkdir -p mac/pkg-scripts
          cp "$RUNNER_TEMP/patch/mac/pkg-scripts/postinstall" mac/pkg-scripts/postinstall
          chmod +x mac/pkg-scripts/postinstall

      - name: Build universal bootstrap PKG and DMG
        run: |
          set -euo pipefail

          mkdir -p release dmg-stage

          cp payloads/mac-payload-x86_64.zip release/
          cp payloads/mac-payload-arm64.zip release/

          pkgbuild \
            --nopayload \
            --scripts mac/pkg-scripts \
            --identifier "is.great.sl4m3d.signer.bootstrap" \
            --version "1.2.0" \
            --install-location / \
            release/installer.pkg

          cp release/installer.pkg dmg-stage/installer.pkg

          hdiutil create \
            -volname "sl4m3d Signer" \
            -srcfolder dmg-stage \
            -ov \
            -format UDZO \
            release/installer.dmg

          test -s release/installer.pkg
          test -s release/installer.dmg

          for file in release/installer.pkg release/installer.dmg; do
            size=$(stat -f%z "$file")
            echo "$file: $((size / 1024 / 1024)) MB"
            test "$size" -lt 10485760
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            release/installer.pkg
            release/installer.dmg
            release/mac-payload-x86_64.zip
            release/mac-payload-arm64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - windows
      - macos-bootstrap

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: windows-build
          path: collected/windows
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: macos-installers
          path: collected/macos
          merge-multiple: true

      - name: Prepare release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag"
            exit 1
          fi

          mkdir -p release

          cp collected/windows/installer.exe release/
          cp collected/windows/windows-payload.zip release/

          cp collected/macos/installer.pkg release/
          cp collected/macos/installer.dmg release/
          cp collected/macos/mac-payload-x86_64.zip release/
          cp collected/macos/mac-payload-arm64.zip release/

          # Reuse existing Android and Linux release assets.
          gh release download latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern installer.apk \
            --dir release

          gh release download latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern installer.deb \
            --dir release

          gh release download latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern installer-portable.tar.gz \
            --dir release

          test -s release/installer.exe
          test -s release/installer.pkg
          test -s release/installer.dmg
          test -s release/installer.apk
          test -s release/installer.deb
          test -s release/installer-portable.tar.gz

          cat > release/README.txt <<'EOF'
          sl4m3d Signer

          Windows:
          installer.exe

          macOS:
          installer.pkg
          installer.dmg

          Android:
          installer.apk

          Linux:
          installer.deb
          installer-portable.tar.gz

          macOS installer supports Intel and Apple Silicon.
          Internet connection is required for installation.

          macOS: ad-hoc signed, not notarized.
          Windows: unsigned.
          Android: existing APK.
          Linux: existing packages.
          EOF

          (
            cd release
            sha256sum \
              installer.exe \
              installer.pkg \
              installer.dmg \
              installer.apk \
              installer.deb \
              installer-portable.tar.gz \
              windows-payload.zip \
              mac-payload-x86_64.zip \
              mac-payload-arm64.zip \
              > SHA256SUMS.txt
          )

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            gh release upload "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber

            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "sl4m3d Signer $RELEASE_TAG" \
              --notes-file release/README.txt
          else
            gh release create "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "sl4m3d Signer $RELEASE_TAG" \
              --notes-file release/README.txt
          fi

          echo "Release successfully published."
