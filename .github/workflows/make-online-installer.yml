
name: Build Installers and Publish v1.2.1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signer-release-v1-2-1
  cancel-in-progress: false

env:
  RELEASE_TAG: v1.2.1
  SOURCE_TAG: v1.2.0
  APP_NAME: sl4m3d Signer

jobs:

  # ==========================================
  # WINDOWS
  # ==========================================

  windows:
    name: Build Windows Installer
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        shell: pwsh
        run: |
          choco install openssl.light innosetup --yes --no-progress

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows/requirements-build.txt

      - name: Build Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $OpenSSL = Get-Command openssl -ErrorAction Stop
          $OpenSSLBin = Split-Path -Parent $OpenSSL.Source
          $OpenSSLHome = Split-Path -Parent $OpenSSLBin

          Remove-Item build, dist -Recurse -Force -ErrorAction SilentlyContinue

          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name "sl4m3d Signer" `
            --add-data "linux\source-portable\app\assets;assets" `
            linux\source-portable\app\src\signer.py

          if (!(Test-Path "dist/sl4m3d Signer")) {
            throw "PyInstaller did not create the application."
          }

          $Bundle = "dist/sl4m3d Signer/openssl"
          New-Item -ItemType Directory -Force -Path $Bundle | Out-Null

          Copy-Item "$OpenSSLHome/*" $Bundle -Recurse -Force

          if (!(Test-Path "$Bundle/bin/openssl.exe")) {
            throw "OpenSSL runtime missing."
          }

      - name: Create Windows payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force windows/output | Out-Null

          Compress-Archive `
            -Path "dist/sl4m3d Signer/*" `
            -DestinationPath "windows/output/windows-payload.zip" `
            -CompressionLevel Optimal `
            -Force

          if (!(Test-Path "windows/output/windows-payload.zip")) {
            throw "Windows payload missing."
          }

      - name: Create Windows bootstrap
        shell: pwsh
        run: |
          @'
          param(
              [Parameter(Mandatory=$true)]
              [string]$InstallDir,

              [Parameter(Mandatory=$true)]
              [string]$ReleaseTag
          )

          $ErrorActionPreference = "Stop"

          $Asset = "windows-payload.zip"
          $Url = "https://github.com/sl4m3d/sl4m3d-signer/releases/download/$ReleaseTag/$Asset"

          $TempFile = Join-Path $env:TEMP "sl4m3d-signer-payload.zip"

          Write-Host "Downloading sl4m3d Signer..."

          Invoke-WebRequest `
              -Uri $Url `
              -OutFile $TempFile `
              -UseBasicParsing

          if (!(Test-Path $TempFile)) {
              throw "Payload download failed."
          }

          New-Item -ItemType Directory -Force -Path $InstallDir | Out-Null

          Expand-Archive `
              -LiteralPath $TempFile `
              -DestinationPath $InstallDir `
              -Force

          $Exe = Join-Path $InstallDir "sl4m3d Signer.exe"

          if (!(Test-Path $Exe)) {
              throw "Application executable missing after extraction."
          }

          Remove-Item $TempFile -Force

          Write-Host "Installation completed."
          '@ | Set-Content windows/bootstrap.ps1 -Encoding UTF8

      - name: Create Inno Setup installer
        shell: pwsh
        run: |
          @'
          #define MyAppName "sl4m3d Signer"
          #define MyAppVersion "1.2.1"

          [Setup]
          AppId={{A30C6DE7-AC59-46A1-AC37-0C79C379A12B}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher=sl4m3d
          DefaultDirName={localappdata}\Programs\sl4m3d Signer
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          OutputDir=output
          OutputBaseFilename=installer
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesInstallIn64BitMode=x64compatible

          [Files]
          Source: "bootstrap.ps1"; DestDir: "{tmp}"; Flags: deleteafterinstall

          [Icons]
          Name: "{autoprograms}\sl4m3d Signer"; Filename: "{app}\sl4m3d Signer.exe"
          Name: "{autodesktop}\sl4m3d Signer"; Filename: "{app}\sl4m3d Signer.exe"

          [Run]
          Filename: "{sys}\WindowsPowerShell\v1.0\powershell.exe"; Parameters: "-NoProfile -ExecutionPolicy Bypass -File ""{tmp}\bootstrap.ps1"" -InstallDir ""{app}"" -ReleaseTag ""v1.2.1"""; Flags: runhidden waituntilterminated
          '@ | Set-Content windows/installer.iss -Encoding UTF8

          $ISCC = Get-Command ISCC.exe -ErrorAction Stop

          & $ISCC.Source "windows/installer.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed."
          }

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $Installer = "windows/output/installer.exe"

          if (!(Test-Path $Installer)) {
            throw "installer.exe missing."
          }

          $Size = (Get-Item $Installer).Length

          Write-Host "Installer size: $Size bytes"

          if ($Size -ge 10485760) {
            throw "Windows installer exceeds 10 MB."
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            windows/output/installer.exe
            windows/output/windows-payload.zip
          if-no-files-found: error

  # ==========================================
  # MACOS INTEL + APPLE SILICON
  # ==========================================

  macos:
    name: Build macOS Payload (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64

          - runner: macos-latest
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install OpenSSL
        run: brew install openssl@3

      - name: Build macOS application
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: |
          set -euo pipefail

          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller==6.16.0

          OPENSSL_PREFIX="$(brew --prefix openssl@3)"

          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --name "sl4m3d Signer" \
            --add-data "linux/source-portable/app/assets:assets" \
            linux/source-portable/app/src/signer.py

          APP="dist/sl4m3d Signer.app"

          test -d "$APP"

          OPENSSL_DIR="$APP/Contents/Frameworks/openssl"

          mkdir -p \
            "$OPENSSL_DIR/bin" \
            "$OPENSSL_DIR/lib/ossl-modules" \
            "$OPENSSL_DIR/ssl"

          cp -L "$OPENSSL_PREFIX/bin/openssl" \
            "$OPENSSL_DIR/bin/openssl"

          cp -L "$OPENSSL_PREFIX/lib/libcrypto.3.dylib" \
            "$OPENSSL_DIR/lib/libcrypto.3.dylib"

          cp -L "$OPENSSL_PREFIX/lib/libssl.3.dylib" \
            "$OPENSSL_DIR/lib/libssl.3.dylib"

          cp -L "$OPENSSL_PREFIX/lib/ossl-modules/legacy.dylib" \
            "$OPENSSL_DIR/lib/ossl-modules/legacy.dylib"

          if [[ -f "$OPENSSL_PREFIX/ssl/openssl.cnf" ]]; then
            cp -L "$OPENSSL_PREFIX/ssl/openssl.cnf" \
              "$OPENSSL_DIR/ssl/openssl.cnf"
          fi

          install_name_tool -change \
            "$OPENSSL_PREFIX/lib/libcrypto.3.dylib" \
            "@loader_path/../libcrypto.3.dylib" \
            "$OPENSSL_DIR/lib/libssl.3.dylib" || true

          install_name_tool -change \
            "$OPENSSL_PREFIX/lib/libcrypto.3.dylib" \
            "@executable_path/../lib/libcrypto.3.dylib" \
            "$OPENSSL_DIR/bin/openssl" || true

          install_name_tool -change \
            "$OPENSSL_PREFIX/lib/libssl.3.dylib" \
            "@executable_path/../lib/libssl.3.dylib" \
            "$OPENSSL_DIR/bin/openssl" || true

          chmod 755 "$OPENSSL_DIR/bin/openssl"

          codesign --force --deep --sign - "$APP"

          mkdir -p mac-output

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" \
            "mac-output/mac-payload-${{ matrix.arch }}.zip"

          test -s "mac-output/mac-payload-${{ matrix.arch }}.zip"

      - name: Upload macOS payload
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: mac-output/mac-payload-${{ matrix.arch }}.zip
          if-no-files-found: error

  # ==========================================
  # UNIVERSAL MACOS BOOTSTRAP INSTALLERS
  # ==========================================

  macos-installers:
    name: Create installer.pkg and installer.dmg
    runs-on: macos-latest
    needs: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS payloads
        uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: payloads
          merge-multiple: true

      - name: Create macOS postinstall script
        run: |
          set -euo pipefail

          mkdir -p mac/pkg-scripts release dmg-stage

          cat > mac/pkg-scripts/postinstall <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          TAG="v1.2.1"
          REPO="sl4m3d/sl4m3d-signer"

          ARCH="$(uname -m)"

          case "$ARCH" in
            arm64)
              ASSET="mac-payload-arm64.zip"
              ;;
            x86_64)
              ASSET="mac-payload-x86_64.zip"
              ;;
            *)
              echo "Unsupported Mac architecture: $ARCH"
              exit 1
              ;;
          esac

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          BASE="https://github.com/$REPO/releases/download/$TAG"

          curl -fL "$BASE/$ASSET" -o "$TMP/payload.zip"
          curl -fL "$BASE/SHA256SUMS.txt" -o "$TMP/SHA256SUMS.txt"

          cd "$TMP"

          grep -E "^[[:xdigit:]]{64}  ${ASSET}$" SHA256SUMS.txt \
            > expected.txt

          test -s expected.txt
          shasum -a 256 -c expected.txt

          mkdir extracted
          ditto -x -k payload.zip extracted

          APP="$(find extracted -name 'sl4m3d Signer.app' -type d -print -quit)"

          if [[ -z "$APP" ]]; then
            echo "Application bundle not found."
            exit 1
          fi

          rm -rf "/Applications/sl4m3d Signer.app"
          ditto "$APP" "/Applications/sl4m3d Signer.app"

          echo "sl4m3d Signer installed successfully."
          exit 0
          SCRIPT

          chmod +x mac/pkg-scripts/postinstall

      - name: Build PKG and DMG
        run: |
          set -euo pipefail

          cp payloads/mac-payload-x86_64.zip release/
          cp payloads/mac-payload-arm64.zip release/

          pkgbuild \
            --nopayload \
            --scripts mac/pkg-scripts \
            --identifier "is.great.sl4m3d.signer.bootstrap" \
            --version "1.2.1" \
            --install-location / \
            release/installer.pkg

          cp release/installer.pkg dmg-stage/installer.pkg

          hdiutil create \
            -volname "sl4m3d Signer" \
            -srcfolder dmg-stage \
            -ov \
            -format UDZO \
            release/installer.dmg

          test -s release/installer.pkg
          test -s release/installer.dmg

          for file in release/installer.pkg release/installer.dmg; do
            SIZE=$(stat -f%z "$file")
            echo "$file: $SIZE bytes"
            test "$SIZE" -lt 10485760
          done

      - name: Upload macOS installers and payloads
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            release/installer.pkg
            release/installer.dmg
            release/mac-payload-x86_64.zip
            release/mac-payload-arm64.zip
          if-no-files-found: error

  # ==========================================
  # GITHUB RELEASE v1.2.1
  # ==========================================

  release:
    name: Publish GitHub Release v1.2.1
    runs-on: ubuntu-24.04

    needs:
      - windows
      - macos-installers

    permissions:
      contents: write

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: collected/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-installers
          path: collected/macos

      - name: Prepare release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p release

          cp collected/windows/installer.exe release/
          cp collected/windows/windows-payload.zip release/

          cp collected/macos/installer.pkg release/
          cp collected/macos/installer.dmg release/

          cp collected/macos/mac-payload-x86_64.zip release/
          cp collected/macos/mac-payload-arm64.zip release/

      - name: Reuse Android and Linux from v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release download v1.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern installer.apk \
            --dir release

          gh release download v1.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern installer.deb \
            --dir release

          gh release download v1.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern installer-portable.tar.gz \
            --dir release

          test -s release/installer.apk
          test -s release/installer.deb
          test -s release/installer-portable.tar.gz

      - name: Generate release notes and checksums
        run: |
          set -euo pipefail

          cat > release/README.txt <<'EOF'
          sl4m3d Signer v1.2.1

          WINDOWS
          installer.exe

          macOS
          installer.pkg
          installer.dmg

          ANDROID
          installer.apk

          LINUX
          installer.deb
          installer-portable.tar.gz

          macOS supports Intel and Apple Silicon.
          Internet access is required for online installation.

          Windows: unsigned.
          macOS: ad-hoc signed, not notarized.
          Android: existing APK.
          Linux: existing packages.
          EOF

          (
            cd release

            sha256sum \
              installer.exe \
              installer.pkg \
              installer.dmg \
              installer.apk \
              installer.deb \
              installer-portable.tar.gz \
              windows-payload.zip \
              mac-payload-x86_64.zip \
              mac-payload-arm64.zip \
              > SHA256SUMS.txt
          )

      - name: Create or update v1.2.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="v1.2.1"

          if gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            echo "Release already exists. Updating assets."

            gh release upload "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber

            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "sl4m3d Signer v1.2.1" \
              --notes-file release/README.txt

          else

            echo "Creating release v1.2.1."

            gh release create "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "sl4m3d Signer v1.2.1" \
              --notes-file release/README.txt

          fi

          echo "Release v1.2.1 successfully published."

      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release view v1.2.1 \
            --repo "$GITHUB_REPOSITORY"

          gh release view v1.2.1 \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name'
