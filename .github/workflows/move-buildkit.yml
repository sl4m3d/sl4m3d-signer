name: Move installer files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Move platform files
        run: |
          set -e

          for folder in android linux mac windows; do
            cp -a "installer-buildkit/$folder" .
          done

          cp installer-buildkit/BUILD-INSTALLERS.md .
          cp installer-buildkit/BUILD-STATUS.txt .
          cp installer-buildkit/README.md .

          mkdir -p .github/workflows
cp installer-buildkit/.github/workflows/build-installers.yml .github/workflows/build-installers.yml

          rm -rf installer-buildkit/android
          rm -rf installer-buildkit/linux
          rm -rf installer-buildkit/mac
          rm -rf installer-buildkit/windows

          rm -f sl4m3d-signer-installer-buildkit.zip

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move installer files to root"
          git push
