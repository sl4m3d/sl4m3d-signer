
name: Move installer files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move installer files
        run: |
          set -e

          for folder in android linux mac windows; do
            if [ -d "installer-buildkit/$folder" ]; then
              cp -a "installer-buildkit/$folder" .
              rm -rf "installer-buildkit/$folder"
            fi
          done

          for file in BUILD-INSTALLERS.md BUILD-STATUS.txt README.md; do
            if [ -f "installer-buildkit/$file" ]; then
              cp "installer-buildkit/$file" .
              rm "installer-buildkit/$file"
            fi
          done

          rm -f sl4m3d-signer-installer-buildkit.zip

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Organize installer build files"
          git push
