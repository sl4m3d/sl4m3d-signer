name: Move installer buildkit to root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move files to repository root
        run: |
          set -e

          test -d installer-buildkit

          cp -a installer-buildkit/. .

          test -f .github/workflows/build-installers.yml
          test -d android
          test -d linux
          test -d mac
          test -d windows

          rm -rf installer-buildkit
          rm -f sl4m3d-signer-installer-buildkit.zip

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move installer buildkit to repository root"
          git push
