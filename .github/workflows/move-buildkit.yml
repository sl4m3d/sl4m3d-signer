
name: Move installer files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move installer files
        run: |
          set -e

          # Move platform folders to repository root
          for folder in android linux mac windows; do
            if [ -d "installer-buildkit/$folder" ]; then
              cp -a "installer-buildkit/$folder" .
            fi
          done

          # Move documentation
          cp installer-buildkit/BUILD-INSTALLERS.md .
          cp installer-buildkit/BUILD-STATUS.txt .
          cp installer-buildkit/README.md .

          # Activate the actual build workflow
          mkdir -p .github/workflows
          cp installer-buildkit/.github/workflows/build-installers.yml \
            .github/workflows/build-installers.yml

          # Remove the old nested buildkit contents
          rm -rf installer-buildkit

          # Remove the original archive if it exists
          rm -f sl4m3d-signer-installer-buildkit.zip

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Set up installer build structure"
          git push
